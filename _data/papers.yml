# Paper lists. Each section shows in the middle column in this order.
#
# Fields per paper:
#   id            short name. If _writeups/<id>.md exists, clicking anywhere on the
#                 entry (outside its links) opens that write-up.
#   title         HTML allowed (e.g. <i>k</i>)
#   under_review  true shows red "under review" after the title
#   authors       plain text; names listed under `me` in _config.yml get bolded
#   venue         shown after the authors
#   links         any of website / paper / arXiv / code / doi, shown in the order written;
#                 the title links to the first one
#   bibtex        optional; shows a [bibtex] toggle
#   hint          optional; a speech bubble the cursor shows while it is over the entry

- section: Robotics & ML
  id: robotics
  papers:
    - id: kwm
      title: "<i>k</i>-WM: Predicting <i>k</i> Steps at Once for Long-Horizon Planning with World Models"
      under_review: true
      authors: "X. A. Jiang*, Y. Wang*, L. Pinto, Y. LeCun, G. Zhou"
      venue: ICLR 2027 submission.
      links:
        website: https://anon-k-wm.github.io/

    - id: panotac
      title: "PanoTac: A Dense Three-Axis Tactile Sensor for Robust Touch-Centric Manipulation"
      under_review: true
      authors: "B. Wang*, X. Jiang*, Z. Teng, X. Liu, Y. Li, L. Pinto, Z. J. Cui, B. Huang"
      venue: ICRA 2027 submission.
      hint: Make sure you scroll to the bottom of the website!
      links:
        website: https://panotac.github.io/

    - id: yor
      title: "YOR: Your Own Mobile Manipulator for Generalizable Robotics"
      authors: "M. H. Anjaria, M. E. Erciyes, V. Ghatnekar, N. Navarkar, H. Etukuru, X. Jiang, K. Patel, D. Kabra, N. Wojno, R. A. Prayage, S. Chintala, L. Pinto, N. M. M. Shafiullah, Z. J. Cui"
      venue: arXiv 2026.
      links:
        website: https://www.yourownrobot.ai/
        arXiv: https://arxiv.org/abs/2602.11150
      bibtex: |
        @article{anjaria2026yor,
          title   = {YOR: Your Own Mobile Manipulator for Generalizable Robotics},
          author  = {Anjaria, M. H. and Erciyes, M. E. and Ghatnekar, V. and Navarkar, N. and Etukuru, H. and Jiang, X. and Patel, K. and Kabra, D. and Wojno, N. and Prayage, R. A. and Chintala, S. and Pinto, L. and Shafiullah, N. M. M. and Cui, Z. J.},
          journal = {arXiv preprint arXiv:2602.11150},
          year    = {2026}
        }

