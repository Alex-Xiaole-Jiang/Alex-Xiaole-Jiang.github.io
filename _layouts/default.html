{%- assign v = site.time | date: "%s" -%}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="color-scheme" content="light dark">
  <link rel="canonical" href="{{ site.url }}{{ page.url | relative_url }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url | relative_url }}">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preload" href="{{ '/assets/fonts/charter-regular.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <script>try { var t = localStorage.getItem("theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ v }}">
  <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ v }}" defer></script>
  <script src="{{ '/assets/js/qft.js' | relative_url }}?v={{ v }}" defer></script>
</head>
<body{% if jekyll.environment == "development" %} class="dev"{% endif %}>
<canvas id="qft" aria-hidden="true"></canvas>
{{ content }}
{% if site.goatcounter != "" and jekyll.environment == "production" %}<script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
{% endif %}</body>
</html>
