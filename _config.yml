# Site settings. GitHub Pages builds this with Jekyll; no plugins needed.
title: Alex Jiang
description: Alex Jiang works on world models and planning for robots. PhD in theoretical physics, CUNY Graduate Center.
url: https://alex-xiaole-jiang.github.io
baseurl: ""

# Left column
name: Alex Jiang
name_zh: 姜晓乐
tagline:
  - A physicist who doesn't like philosophy makes a poor roboticist.
# Two photos. The night one shows first, whatever the theme. Once the theme is
# switched, night shows photo_night and day shows photo_day; hovering over the
# photo (tapping, on a phone) shows the other one.
photo_night: /assets/img/photo-night.jpg
photo_day: /assets/img/photo-day.jpg
email: xiaole.jiang.alex@gmail.com
cv: /assets/xiaole-alex-jiang-cv.pdf
github: https://github.com/Alex-Xiaole-Jiang
scholar: "https://scholar.google.com/citations?user=SgH2ZFkAAAAJ&hl=en"

# Analytics (GoatCounter: free, no cookies, no banner needed).
# Sign up at goatcounter.com, then put the code you picked here, e.g. "alexjiang".
goatcounter: ""

# Author names that get bolded in paper lists
me:
  - X. A. Jiang
  - X. Jiang

# Long write-ups, one Markdown file per paper, keyed by file name = paper id
collections:
  writeups:
    output: false

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
