# Site settings. GitHub Pages builds this with Jekyll; no plugins needed.
title: Xiaole (Alex) Jiang
description: Xiaole (Alex) Jiang works on world models and planning for robots. PhD in theoretical physics, CUNY Graduate Center.
url: https://alex-xiaole-jiang.github.io
baseurl: ""

# Left column
name: Xiaole Jiang
nickname: Alex   # goes on the line under the name, beside name_zh
name_zh: 姜晓乐
tagline:
  - Physicist by training, philosopher by habit, making beautiful ideas work.
# Photos. The first shows on load; each switch between day and night moves to
# the next. Hovering shows another one at random, and a click (a tap, on a
# phone) keeps it.
photos:
  - /assets/img/photo-2.jpg
  - /assets/img/photo-1.jpg
  - /assets/img/photo-3.jpg
email: xiaole.jiang.alex@gmail.com
cv: /assets/xiaole-alex-jiang-cv.pdf
github: https://github.com/Alex-Xiaole-Jiang
scholar: "https://scholar.google.com/citations?user=SgH2ZFkAAAAJ&hl=en"
x: https://x.com/AlexXiaoleJiang   # shown as the X logo

# Analytics (GoatCounter: free, no cookies, no banner needed).
# Sign up at goatcounter.com, then put the code you picked here, e.g. "alexjiang".
goatcounter: ""

# Author names that get bolded in paper lists
me:
  - X. A. Jiang
  - X. Jiang

# Long write-ups, one Markdown file per paper, keyed by file name = paper id
collections:
  writeups:
    output: false

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
